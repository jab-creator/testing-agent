project:
  name: "citizenship-tracker"
  type: "static_web"

run:
  command: "python -m http.server 8000"
  wait_for: "http://localhost:8000/index.html"
  timeout: 10

test:
  target_folder: "citizenship_tracker"
  strategy: "selenium"
  base_url_env: "APP_BASE_URL"
  default_suite: "smoke"
  endpoints:
    - "/"
    - "/index.html"

selectors:
  strategy: "text"

env:
  APP_BASE_URL: "http://localhost:8000/index.html"
