[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testing-agent"
version = "0.1.0"
description = "Standalone testing agent for multiple repos"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.31",
  "pytest>=8.0",
  "selenium>=4.20",
  "webdriver-manager>=4.0",
]

[project.scripts]
qa = "cli.qa:main"

[tool.setuptools]
# Include top-level packages and subpackages (e.g. adapters.shared).
packages = {find = {include = ["agent_core*", "adapters*", "runners*", "cli*"]}}
