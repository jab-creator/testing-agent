name: Run QA Agent (Reusable)

on:
  workflow_call:
    inputs:
      target_repo:
        description: "Full repo name e.g. jab-creator/canadian-citizen-progression"
        required: true
        type: string
      target_ref:
        description: "Git ref/sha to test (PR head sha recommended)"
        required: true
        type: string

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout testing-agent
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps (Chromium + driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver
          chromium-browser --version
          chromedriver --version

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install selenium webdriver-manager

      - name: Run QA (capture log)
        id: runqa
        shell: bash
        run: |
          set +e
          qa --repo "https://github.com/${{ inputs.target_repo }}" --ref "${{ inputs.target_ref }}" | tee qa.log
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=$exit_code" >> $GITHUB_OUTPUT
          exit 0

      - name: Upload QA log
        uses: actions/upload-artifact@v4
        with:
          name: qa-log
          path: qa.log

      - name: Comment on PR (pass/fail)
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ steps.runqa.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const exitCode = Number(process.env.EXIT_CODE || "999");
            const ok = exitCode === 0;

            const log = fs.readFileSync('qa.log', 'utf8');
            const tail = log.split('\n').slice(-80).join('\n'); // last 80 lines

            const marker = '<!-- QA_AGENT_COMMENT -->';
            const body =
`${marker}
### QA Agent: ${ok ? '✅ PASS' : '❌ FAIL'}

- Repo: \`${context.repo.owner}/${context.repo.repo}\`
- Ref: \`${context.payload.pull_request.head.sha}\`
- Exit code: \`${exitCode}\`

<details>
<summary>Log tail</summary>

\`\`\`
${tail}
\`\`\`
</details>
`;

            const prNumber = context.payload.pull_request.number;

            // Upsert: update existing comment from this bot if present
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker) && c.user && c.user.type === 'Bot');
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Fail the job if QA failed
        if: ${{ steps.runqa.outputs.exit_code != '0' }}
        run: |
          echo "QA failed (exit code ${{ steps.runqa.outputs.exit_code }})"
          exit 1
